async function copy(text,button){
  try {
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}
    else {throw new Error('Presse-papiers indisponible')}
  } catch {
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    let copied=false;try{copied=document.execCommand('copy')}catch{}finally{ta.remove()}
    if(!copied){toast('Copie indisponible : sélectionnez le texte ou téléchargez le fichier.');return}
  }
  toast('Texte copié');if(button){const old=button.textContent;button.textContent='✓ Copié';setTimeout(()=>button.textContent=old,1500)}
}
function download(text,name){const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast(`Téléchargement : ${name}`)}
function toast(msg){let x=document.querySelector('.toast');if(!x){x=document.createElement('div');x.className='toast';document.body.appendChild(x)}x.textContent=msg;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}

function field(name,label,placeholder='',long=false,detail=''){const value=e(draft[name]||'');return `<label class="field"><span>${label}</span>${detail?`<small>${detail}</small>`:''}${long?`<textarea rows="${name==='reponse'?6:3}" data-field="${name}" placeholder="${e(placeholder)}">${value}</textarea>`:`<input type="text" data-field="${name}" value="${value}" placeholder="${e(placeholder)}" />`}</label>`}
function wizard(){return `${title('ATELIER DE PRODUCTION · DOCUMENT PERSONNEL','Construisez votre prompt structuré V1','Remplissez les rubriques puis téléchargez le document Markdown. Votre saisie est conservée uniquement dans le navigateur utilisé, si son stockage local est disponible.')}
<div class="workspace"><div class="builder"><div class="builder-head"><div><div class="section-caption">01 / CHOIX DU LIVRABLE</div><h2>Définir le besoin</h2></div><button class="button tiny" data-action="resetDraft">↺ Réinitialiser</button></div><div class="template-choose"><label for="template">Charger un cas fictif comme point de départ</label><select id="template" data-select="template"><option value="custom">Saisie personnelle</option>${cases.map(x=>`<option value="${x.id}" ${draft.caseId===x.id?'selected':''}>${e(x.title)}</option>`).join('')}</select><small>Adaptez les données fictives avant de les utiliser.</small></div><div class="form-grid">${field('livrable','Livrable choisi','Ex. fiche projet')}${field('public','Public concerné','Ex. participants débutants')}${field('besoin','Besoin initial','Quel problème voulez-vous résoudre ?',true)}${field('utilite','Utilité concrète','À quoi sert le livrable ?',true)}</div>
<div class="builder-head spaced"><div><div class="section-caption">02 / SIX RUBRIQUES</div><h2>Structurer la consigne</h2></div><span class="muted">1 → 6</span></div><div class="fields-six">${field('role','01 · Rôle','Tu es…',true,'Décrivez l’assistant que vous sollicitez.')}${field('contexte','02 · Contexte','Situation, public, usage',true,'Informations connues et pertinentes.')}${field('mission','03 · Mission','Rédige, construis, compare…',true,'Un seul livrable mesurable.')}${field('contrainte1','04 · Contrainte 1','Ton, longueur, limite')}${field('contrainte2','04 · Contrainte 2','Public, structure, précision')}${field('contrainte3','04 · Contrainte 3','Ne pas inventer…')}${field('format','05 · Format attendu','Tableau, checklist, message…',true)}${field('amelioration','06 · Amélioration','Propose 3 améliorations possibles…',true)}</div>

<div class="workspace-side"><div class="preview-card"><div class="preview-head"><div class="section-caption">APERÇU DYNAMIQUE</div><strong>Votre prompt</strong></div><pre id="live-preview">${e(getPrompt())}</pre><button class="button dark block" data-action="copyPrompt">⧉ Copier le prompt seul</button></div><div class="quality-card"><div class="section-caption">COMPLÉTUDE</div><div id="score-large">${score()} / 8</div><p>La complétude vérifie seulement la présence des rubriques. Elle ne garantit pas leur exactitude.</p><div class="micro-progress"><span id="quality-bar" style="width:${score()/8*100}%"></span></div><div id="quality-list">${qualityList()}</div></div><div class="file-note"><strong>Fichier à enregistrer</strong><code>${path}</code><span>Après téléchargement, rangez-le dans le dossier <b>02-prompts</b> de votre projet candidat.</span></div></div></div>`}
const checks=[['role','Rôle'],['contexte','Contexte'],['mission','Mission'],['contrainte1','Contrainte 1'],['contrainte2','Contrainte 2'],['contrainte3','Contrainte 3'],['format','Format attendu'],['amelioration','Amélioration']];
function score(){return checks.filter(([key])=>String(draft[key]||'').trim().length>5).length}
function qualityList(){return checks.map(([key,label])=>`<div class="mini-check"><span class="${String(draft[key]||'').trim().length>5?'yes':'no'}">${String(draft[key]||'').trim().length>5?'✓':'○'}</span>${label}</div>`).join('')}
function updatePreview(){let p=document.getElementById('live-preview');if(p)p.textContent=getPrompt();const s=document.getElementById('score-large');if(s)s.textContent=`${score()} / 8`;const l=document.getElementById('quality-list');if(l)l.innerHTML=qualityList();const b=document.getElementById('quality-bar');if(b)b.style.width=`${score()/8*100}%`}
function control(){const items=['J’ai choisi un livrable unique et utile','Le rôle et le contexte sont clairs','La mission précise ce qu’il faut produire','Trois contraintes utiles sont visibles','Le format de sortie est demandé','Le prompt a été testé avec une IA réelle','J’ai relu la réponse et noté les informations incertaines','Une correction ciblée est formulée si nécessaire','J’ai téléchargé prompt-structure-v1.md','J’ai conservé la preuve dans mon portfolio'];const n=items.filter((x,i)=>checkStates[i]).length;return `${title('CONTRÔLE HUMAIN','Valider la méthode, pas seulement le texte','L’objectif de l’atelier est une production vérifiée et archivée. Cochez les étapes réellement accomplies.')}
<div class="review-grid"><div class="review-main"><div class="review-top"><h2>Checklist de la séance 06</h2><div class="review-count">${n} / ${items.length}</div></div><div class="review-list">${items.map((x,i)=>`<label><input type="checkbox" data-check="${i}" ${checkStates[i]?'checked':''}><span>${x}</span></label>`).join('')}</div><div class="review-actions"><button class="button primary" data-action="downloadChecklist">↓ Exporter la checklist</button><button class="button secondary" data-action="resetChecklist">↺ Effacer les coches</button></div></div><div class="review-side"><div class="quote-card"><div class="section-caption">MÉTHODE LN-IA</div><p>L’IA propose.<br>L’humain contrôle.<br>L’atelier organise.<br>Le livrable prouve.</p></div><div class="note-card"><h3>Présentation orale</h3><p>1 à 2 minutes par candidat.</p><ol><li>Mon livrable choisi est…</li><li>Mon rôle et ma mission sont…</li><li>Mes contraintes sont…</li><li>Le format attendu est…</li><li>La correction demandée est…</li></ol></div></div></div><div class="insight"><b>Critère de réussite</b><p>Une production exploitable avec une première réponse réellement testée, une relecture humaine, une éventuelle correction et un fichier Markdown correctement classé.</p></div>`}
function cards(){const x=flashcards[cardIndex];return `${title('MÉMORISATION ACTIVE','Flashcards : réviser les fondamentaux','Cliquez sur la carte pour afficher la réponse, puis passez à la suivante.')}
<div class="flash-main"><div class="flash-meta"><span>CARTE ${String(cardIndex+1).padStart(2,'0')} / ${flashcards.length}</span><span>${x.tag}</span></div><button class="flashcard ${cardFlipped?'flipped':''}" data-action="flipCard"><div class="flash-hint">${cardFlipped?'RÉPONSE':'QUESTION'}</div><h2>${cardFlipped?e(x.a):e(x.q)}</h2><span class="flash-bottom">Cliquez pour ${cardFlipped?'revoir la question':'retourner la carte'} ↗</span></button><div class="flash-controls"><button class="button secondary" data-action="prevCard">← Précédente</button><button class="button primary" data-action="nextCard">Suivante →</button></div></div>`}
function next(){return `${title('TRANSITION VERS LA SÉANCE 07','Comprendre le prompt maître personnel','La séance 06 a préparé un prompt pour un livrable. La séance 07 construit un cadre personnel réutilisable dans le Challenge.')}
<div class="next-hero"><span>SÉANCE 07 · MODULE 02 · SEMAINE 04</span><h2>De la tâche ponctuelle au cadre de travail durable.</h2><p>Un prompt maître décrit votre profil, vos objectifs, vos livrables, vos règles de réponse et la manière de corriger votre production.</p></div><div class="anatomy-grid next-grid"><article class="anatomy-card"><span class="element-index">01</span><h3>Mon profil</h3><p>Activité, public, compétences et domaine de travail.</p><span class="muted">Quelles informations l’assistant doit-il connaître ?</span></article><article class="anatomy-card"><span class="element-index">02</span><h3>Mon objectif</h3><p>Ce que je souhaite accomplir durant les 100 jours.</p><span class="muted">Quel résultat concret est attendu ?</span></article><article class="anatomy-card"><span class="element-index">03</span><h3>Mes livrables</h3><p>Trois réalisations prioritaires, vérifiables et classables.</p><span class="muted">Quelles preuves vais-je conserver ?</span></article><article class="anatomy-card"><span class="element-index">04</span><h3>Mes règles</h3><p>Ton souhaité, contraintes, corrections et vérifications humaines.</p><span class="muted">Comment l’IA doit-elle me répondre ?</span></article></div><div class="section"><div class="section-caption">PRÉPARATION À RÉALISER</div><h2>Trois prompts à préparer</h2><div class="step-row three">${['Prompt personnel','Prompt professionnel','Prompt pédagogique'].map((x,i)=>`<div class="step-cell"><span class="step-num">0${i+1}</span><strong>${x}</strong><small>Identifier le besoin et le livrable</small></div>`).join('')}</div><div class="cta-box"><div><b>Questions de départ pour votre prompt maître</b><p>Qui suis-je ? Que veux-je produire ? Comment vérifier, corriger et archiver mes résultats ?</p></div><button class="button primary" data-action="downloadS07">↓ Télécharger la préparation S07</button></div></div>`}
const docs=['support-seance-06-prompt-structure-candidats.md','support-seance-06-bases-prompt-candidats.docx','support-seance-06-module-02-challenge-100-jours.docx','support-seance-06-module-02-challenge-100-jours-V3.docx','support-seance-06-prompt-structure-candidats.html','support-seance-06-module-02-challenge-100-jours-LNIA-atelier.html','support-seance-06-module-02-challenge-100-jours-LNIA-atelier.pdf','support-seance-06-module-02-challenge-100-jours-V3.pdf'];
function resources(){return `${title('DOCUMENTATION & TRANSMISSION','Ressources pour le formateur et les candidats','Les fichiers d’origine sont conservés dans le pack. Les exemples supplémentaires du site sont des illustrations pédagogiques fictives.')}
<div class="resource-grid"><div><h2>Supports source intégrés</h2><div class="resource-list">${docs.map(x=>`<a href="./public/supports/${encodeURIComponent(x)}" download><span>↧</span><span>${e(x)}</span><b>↓</b></a>`).join('')}</div></div><div><div class="note-card"><h3>Déroulement indicatif · 110 minutes</h3><div class="schedule"><span>00–10 min</span><p>Accueil, rappel S05, objectif</p><span>10–30 min</span><p>Six rubriques du prompt</p><span>30–45 min</span><p>Démonstration guidée</p><span>45–75 min</span><p>Production autonome</p><span>75–95 min</span><p>Test réel, contrôle, correction</p><span>95–110 min</span><p>Pitch et préparation S07</p></div></div><div class="note-card"><h3>Deux modalités de travail</h3><p><strong>ChatGPT</strong> : copier le prompt et dialoguer pour produire puis ajuster une réponse.</p><p><strong>VS Code + Codex</strong> : sauvegarder le Markdown, travailler dans des fichiers et préparer la suite technique.</p><p>Dans les deux cas, le candidat valide les résultats.</p></div></div></div><div class="insight"><b>Précision documentaire</b><p>Les supports historiques comportent plusieurs versions et un statut « BROUILLON / À RELIRE ». Le calendrier affiché dans ce site suit votre cadrage pédagogique validé : Module 02 sur les semaines 03 et 04, séance 06 en semaine 03. Le livrable est classé dans <code>02-prompts/</code>, conformément au support candidats de la séance 06.</p></div>`}
function render(){const renderers={accueil:home,presentation,anatomie:anatomy,demonstrations,atelier:wizard,controle:control,flashcards:cards,seance07:next,ressources:resources};shell(renderers[page]());document.getElementById('main')?.scrollTo?.(0,0);window.scrollTo(0,0)}
function setPage(p){if(!PAGES.some(x=>x[0]===p))return;page=p;document.querySelector('.sidebar')?.classList.remove('open');render()}
function loadCase(id){const c=cases.find(x=>x.id===id);if(!c)return;draft={...draft,caseId:id,livrable:c.title,besoin:`Je souhaite produire : ${c.title}.`,public:c.context,utilite:'Obtenir un premier livrable exploitable et vérifiable.',role:c.role,contexte:c.context,mission:c.mission,contrainte1:c.constraints[0],contrainte2:c.constraints[1],contrainte3:c.constraints[2],format:c.format,amelioration:c.improve,reponse:'',correction:'',points:'',preuve:'',validation:'À vérifier'};save()}
function onAction(type,button){if(type==='toggleMenu'){document.querySelector('#sidebar')?.classList.toggle('open');return}if(type==='prevSlide')slideIndex=Math.max(0,slideIndex-1);if(type==='nextSlide')slideIndex=Math.min(slides.length-1,slideIndex+1);if(['prevSlide','nextSlide'].includes(type)){render();return}if(type==='fullscreen'){const el=document.getElementById('slide');if(el?.requestFullscreen)el.requestFullscreen().catch(()=>toast('Mode plein écran indisponible'));return}if(type==='copySlide'){let s=slides[slideIndex];copy(`${s.title}\n${s.lead}\n${s.points.join('\n')}\nNotes : ${s.note}`,button);return}if(type==='prevStage'||type==='nextStage'){stage=Math.min(3,Math.max(0,stage+(type==='nextStage'?1:-1)));render();return}if(type==='copyDemoPrompt'){let c=cases[caseIndex];copy(getPrompt({role:c.role,contexte:c.context,mission:c.mission,contrainte1:c.constraints[0],contrainte2:c.constraints[1],contrainte3:c.constraints[2],format:c.format,amelioration:c.improve}),button);return}if(type==='copyDemoOutput'){copy(cases[caseIndex].simulated,button);return}if(type==='copyPrompt'){copy(getPrompt(),button);return}if(type==='copyMd'){copy(getMarkdown(),button);return}if(type==='downloadMd'){download(getMarkdown(),'prompt-structure-v1.md');return}if(type==='resetDraft'){if(confirm('Réinitialiser la fiche de travail ? La saisie actuelle sera remplacée.')){draft={...defaultDraft,reponse:'',correction:'',points:'',preuve:''};save();render()}return}if(type==='downloadChecklist'){download(`# Grille de contrôle — Séance 06\n\n${['J’ai choisi un livrable unique et utile','Le rôle et le contexte sont clairs','La mission précise ce qu’il faut produire','Trois contraintes utiles sont visibles','Le format de sortie est demandé','Le prompt a été testé avec une IA réelle','J’ai relu la réponse et noté les informations incertaines','Une correction ciblée est formulée si nécessaire','J’ai téléchargé prompt-structure-v1.md','J’ai conservé la preuve dans mon portfolio'].map((x,i)=>`- [${checkStates[i]?'x':' '}] ${x}`).join('\n')}\n`,'grille-controle-seance-06.md');return}if(type==='resetChecklist'){checkStates={};render();return}if(type==='flipCard'){cardFlipped=!cardFlipped;render();return}if(type==='prevCard'||type==='nextCard'){cardIndex=(cardIndex+(type==='nextCard'?1:-1)+flashcards.length)%flashcards.length;cardFlipped=false;render();return}if(type==='downloadS07'){download(`# Préparation séance 07 — Prompt maître personnel\n\n## Mon profil\n...\n\n## Mon objectif sur 100 jours\n...\n\n## Trois livrables prioritaires\n1. ...\n2. ...\n3. ...\n\n## Trois essais de prompts\n- Personnel : ...\n- Professionnel : ...\n- Pédagogique : ...\n\n## Mon style de réponse attendu\n...\n\n## Mes règles de correction et de classement\n...\n`,'preparation-seance-07-prompt-maitre.md');return}}
document.addEventListener('click',ev=>{const target=ev.target.closest('button');if(!target)return;if(target.dataset.page){setPage(target.dataset.page);return}if(target.dataset.action){onAction(target.dataset.action,target);return}if(target.dataset.case!==undefined){caseIndex=Number(target.dataset.case);stage=0;render();return}if(target.dataset.stage!==undefined){stage=Number(target.dataset.stage);render();return}});
document.addEventListener('input',ev=>{const key=ev.target.dataset.field;if(key){draft[key]=ev.target.value;save();updatePreview()}});
document.addEventListener('change',ev=>{if(ev.target.dataset.select==='template'){if(ev.target.value!=='custom'){loadCase(ev.target.value);render()}else{draft.caseId='custom';save()}return}if(ev.target.dataset.select==='slide'){slideIndex=Number(ev.target.value);render();return}if(ev.target.dataset.select==='validation'){draft.validation=ev.target.value;save();return}if(ev.target.dataset.check!==undefined){checkStates[Number(ev.target.dataset.check)]=ev.target.checked;render();return}});
document.addEventListener('keydown',ev=>{if(page!=='presentation'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(ev.key==='ArrowRight'){ev.preventDefault();slideIndex=Math.min(slides.length-1,slideIndex+1);render()}else if(ev.key==='ArrowLeft'){ev.preventDefault();slideIndex=Math.max(0,slideIndex-1);render()}});
